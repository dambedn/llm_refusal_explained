[project]
name = "llm-refusal-explained"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "huggingface-hub>=0.36.2",
    "ipython>=9.17.1",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.7.0",
    "tqdm>=4.70.1",
    "transformers>=4.56,<5",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
    "ruff>=0.17.2",
]
local = [
    "torch>=2.14.1",
]
